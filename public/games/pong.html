<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table Pong</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f141c;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .hud {
      width: min(580px, 94vw);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-variant-numeric: tabular-nums;
    }
    .title { font-weight: 800; color: #f59e0b; font-size: 1.25rem; }
    .scoreline { font-size: 1rem; color: #cbd5e1; }
    .scoreline strong { color: #fff; font-size: 1.15rem; }
    .stage {
      position: relative;
      width: min(580px, 94vw);
      aspect-ratio: 16 / 10;
      background: #151d28;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 20, 28, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 1.7rem; margin-bottom: 8px; }
    .overlay p { font-size: 0.9rem; color: #94a3b8; max-width: 300px; line-height: 1.5; margin-bottom: 18px; }
    .btn {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn:hover { background: #fbbf24; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="title">Table Pong</div>
    <div class="scoreline">You <strong id="pScore">0</strong> — <strong id="cScore">0</strong> Rival (First to 7)</div>
  </div>
  <div class="stage">
    <canvas id="canvas" width="600" height="375"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Table Pong</h2>
      <p id="ovDesc">Move your mouse or use Up/Down Arrow keys to control the left paddle. First to 7 points wins.</p>
      <button class="btn" id="startBtn" type="button">Start Game</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const pScoreEl = document.getElementById('pScore');
    const cScoreEl = document.getElementById('cScore');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ovTitle');
    const ovDesc = document.getElementById('ovDesc');
    const startBtn = document.getElementById('startBtn');

    let state = 'TITLE_MENU';
    let pScore = 0, cScore = 0;
    const player = { x: 20, y: 145, w: 10, h: 78, vy: 0 };
    const cpu = { x: 570, y: 145, w: 10, h: 78 };
    const ball = { x: 300, y: 187, vx: 5, vy: 3, r: 7 };
    const keys = { up: false, down: false };

    let audioCtx = null;
    function tap(freq) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.05, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 0.05);
      } catch (_) {}
    }

    function serve(dir = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.vx = dir * 5.2;
      ball.vy = (Math.random() * 4 - 2) || 2.2;
    }

    function startGame() {
      pScore = 0; cScore = 0;
      pScoreEl.textContent = '0';
      cScoreEl.textContent = '0';
      player.y = 148;
      cpu.y = 148;
      serve(1);
      state = 'PLAYING';
      overlay.classList.add('hidden');
    }

    function checkWin() {
      if (pScore >= 7 || cScore >= 7) {
        state = 'GAME_OVER';
        ovTitle.textContent = pScore >= 7 ? 'You Win!' : 'Rival Wins';
        ovDesc.textContent = `Match Score: ${pScore} – ${cScore}`;
        startBtn.textContent = 'Play Again';
        overlay.classList.remove('hidden');
      }
    }

    function loop() {
      if (state === 'PLAYING') {
        if (keys.up) player.y = Math.max(0, player.y - 6.5);
        if (keys.down) player.y = Math.min(canvas.height - player.h, player.y + 6.5);

        const target = ball.y - cpu.h / 2;
        if (cpu.y + 6 < target) cpu.y = Math.min(canvas.height - cpu.h, cpu.y + 4.3);
        else if (cpu.y - 6 > target) cpu.y = Math.max(0, cpu.y - 4.3);

        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; tap(320); }
        if (ball.y + ball.r > canvas.height) { ball.y = canvas.height - ball.r; ball.vy *= -1; tap(320); }

        // Player hit
        if (ball.vx < 0 && ball.x - ball.r <= player.x + player.w && ball.x >= player.x && ball.y >= player.y && ball.y <= player.y + player.h) {
          const offset = (ball.y - (player.y + player.h / 2)) / (player.h / 2);
          ball.vx = Math.min(9, Math.abs(ball.vx) * 1.05);
          ball.vy = offset * 5.4;
          tap(480);
        }

        // CPU hit
        if (ball.vx > 0 && ball.x + ball.r >= cpu.x && ball.x <= cpu.x + cpu.w && ball.y >= cpu.y && ball.y <= cpu.y + cpu.h) {
          const offset = (ball.y - (cpu.y + cpu.h / 2)) / (cpu.h / 2);
          ball.vx = -Math.min(9, Math.abs(ball.vx) * 1.05);
          ball.vy = offset * 5.4;
          tap(420);
        }

        if (ball.x < 0) {
          cScore++;
          cScoreEl.textContent = cScore;
          tap(200);
          checkWin();
          if (state === 'PLAYING') serve(1);
        } else if (ball.x > canvas.width) {
          pScore++;
          pScoreEl.textContent = pScore;
          tap(620);
          checkWin();
          if (state === 'PLAYING') serve(-1);
        }
      }

      ctx.fillStyle = '#151d28';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.roundRect(player.x, player.y, player.w, player.h, 5);
      ctx.roundRect(cpu.x, cpu.y, cpu.w, cpu.h, 5);
      ctx.fill();

      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(loop);
    }

    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const relY = ((e.clientY - rect.top) / rect.height) * canvas.height;
      player.y = Math.max(0, Math.min(canvas.height - player.h, relY - player.h / 2));
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); keys.up = true; }
      if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); keys.down = true; }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.up = false;
      if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.down = false;
    });

    startBtn.addEventListener('click', startGame);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
