<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brick Breaker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f141d;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .hud {
      width: min(560px, 94vw);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-variant-numeric: tabular-nums;
    }
    .title { font-weight: 800; font-size: 1.25rem; color: #38bdf8; }
    .stats { display: flex; gap: 16px; font-size: 0.9rem; color: #cbd5e1; }
    .stats strong { color: #fff; }
    .stage {
      position: relative;
      width: min(560px, 94vw);
      aspect-ratio: 4 / 3;
      background: #141c27;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 20, 29, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 1.7rem; margin-bottom: 8px; }
    .overlay p { font-size: 0.9rem; color: #94a3b8; max-width: 300px; line-height: 1.5; margin-bottom: 18px; }
    .btn {
      background: #38bdf8;
      color: #082f49;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="title">Brick Breaker</div>
    <div class="stats">
      <span>Score: <strong id="score">0</strong></span>
      <span>Lives: <strong id="lives">3</strong></span>
      <span>Best: <strong id="best">0</strong></span>
    </div>
  </div>
  <div class="stage" id="stage">
    <canvas id="canvas" width="560" height="420"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Brick Breaker</h2>
      <p id="ovDesc">Move your mouse or use Left/Right Arrow keys to angle shots and clear every brick wall.</p>
      <button class="btn" id="startBtn" type="button">Start Game</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ovTitle');
    const ovDesc = document.getElementById('ovDesc');
    const startBtn = document.getElementById('startBtn');

    let score = 0;
    let lives = 3;
    let best = Number(localStorage.getItem('vp_breakout_best') || 0);
    bestEl.textContent = best;
    let state = 'TITLE_MENU';

    const paddle = { w: 92, h: 12, x: 234, y: 392, speed: 7 };
    const ball = { x: 280, y: 370, vx: 3.8, vy: -3.8, r: 7 };
    const keys = { left: false, right: false };
    let bricks = [];

    const rowColors = ['#ef4444', '#f97316', '#f59e0b', '#10b981', '#38bdf8'];

    let audioCtx = null;
    function ping(freq) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.05, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + 0.06);
      } catch (_) {}
    }

    function buildBricks() {
      bricks = [];
      const cols = 8, rows = 5, pad = 8, offsetTop = 42, offsetLeft = 24;
      const bw = (canvas.width - offsetLeft * 2 - pad * (cols - 1)) / cols;
      const bh = 20;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          bricks.push({
            x: offsetLeft + c * (bw + pad),
            y: offsetTop + r * (bh + pad),
            w: bw,
            h: bh,
            color: rowColors[r],
            alive: true
          });
        }
      }
    }

    function resetBall() {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - 12;
      ball.vx = (Math.random() > 0.5 ? 1 : -1) * 3.8;
      ball.vy = -4.0;
    }

    function startGame() {
      score = 0;
      lives = 3;
      scoreEl.textContent = '0';
      livesEl.textContent = '3';
      paddle.x = (canvas.width - paddle.w) / 2;
      buildBricks();
      resetBall();
      state = 'PLAYING';
      overlay.classList.add('hidden');
    }

    function endGame(won) {
      state = 'GAME_OVER';
      ovTitle.textContent = won ? 'Wall Cleared!' : 'Game Over';
      ovDesc.textContent = `Final Score: ${score} · Best: ${best}`;
      startBtn.textContent = 'Play Again';
      overlay.classList.remove('hidden');
    }

    function update() {
      if (state === 'PLAYING') {
        if (keys.left) paddle.x = Math.max(0, paddle.x - paddle.speed);
        if (keys.right) paddle.x = Math.min(canvas.width - paddle.w, paddle.x + paddle.speed);

        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; ping(300); }
        if (ball.x + ball.r > canvas.width) { ball.x = canvas.width - ball.r; ball.vx *= -1; ping(300); }
        if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; ping(320); }

        if (
          ball.vy > 0 &&
          ball.y + ball.r >= paddle.y &&
          ball.y - ball.r <= paddle.y + paddle.h &&
          ball.x >= paddle.x &&
          ball.x <= paddle.x + paddle.w
        ) {
          const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          ball.vx = hit * 5.2;
          ball.vy = -Math.max(3.6, Math.abs(ball.vy));
          ping(440);
        }

        for (const b of bricks) {
          if (!b.alive) continue;
          if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
            b.alive = false;
            ball.vy *= -1;
            score += 10;
            scoreEl.textContent = score;
            if (score > best) {
              best = score;
              localStorage.setItem('vp_breakout_best', String(best));
              bestEl.textContent = best;
            }
            ping(580);
            break;
          }
        }

        if (bricks.every(b => !b.alive)) {
          endGame(true);
        } else if (ball.y - ball.r > canvas.height) {
          lives--;
          livesEl.textContent = lives;
          ping(170);
          if (lives <= 0) endGame(false);
          else resetBall();
        }
      }

      ctx.fillStyle = '#141c27';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (const b of bricks) {
        if (!b.alive) continue;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 4);
        ctx.fill();
      }

      ctx.fillStyle = '#e2e8f0';
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
      ctx.fill();

      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(update);
    }

    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const relX = ((e.clientX - rect.left) / rect.width) * canvas.width;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, relX - paddle.w / 2));
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); keys.left = true; }
      if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); keys.right = true; }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    });

    startBtn.addEventListener('click', startGame);
    buildBricks();
    requestAnimationFrame(update);
  </script>
</body>
</html>
