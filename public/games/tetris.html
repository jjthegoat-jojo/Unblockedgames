<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Block Stack</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #10151d;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      overflow: hidden;
      padding: 12px;
    }
    .well {
      position: relative;
      height: min(460px, 86vh);
      aspect-ratio: 1 / 2;
      background: #161d28;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .side {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 136px;
      font-variant-numeric: tabular-nums;
    }
    .brand { font-size: 1.25rem; font-weight: 800; color: #f59e0b; }
    .panel {
      background: #18212e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .label { font-size: 0.72rem; color: #94a3b8; margin-bottom: 2px; }
    .val { font-size: 1.15rem; font-weight: 700; }
    .controls-note { font-size: 0.76rem; color: #94a3b8; line-height: 1.5; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(16, 21, 29, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 18px;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 1.35rem; margin-bottom: 8px; }
    .overlay p { font-size: 0.82rem; color: #94a3b8; line-height: 1.45; margin-bottom: 16px; }
    .btn {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 9px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn:hover { background: #fbbf24; }
  </style>
</head>
<body>
  <div class="well">
    <canvas id="canvas" width="240" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Block Stack</h2>
      <p id="ovDesc">Complete full horizontal rows to score points and advance levels.</p>
      <button class="btn" id="startBtn" type="button">Start Game</button>
    </div>
  </div>

  <div class="side">
    <div class="brand">Block Stack</div>
    <div class="panel">
      <div class="label">Score</div>
      <div class="val" id="score">0</div>
    </div>
    <div class="panel">
      <div class="label">Lines</div>
      <div class="val" id="lines">0</div>
    </div>
    <div class="panel">
      <div class="label">Best</div>
      <div class="val" id="best">0</div>
    </div>
    <div class="controls-note">
      ← / → Move<br/>
      ↑ Rotate<br/>
      ↓ Soft Drop<br/>
      Space Hard Drop
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ovTitle');
    const ovDesc = document.getElementById('ovDesc');
    const startBtn = document.getElementById('startBtn');

    const COLS = 10, ROWS = 20, BLOCK = 24;
    const SHAPES = [
      { m: [[1,1,1,1]], c: '#38bdf8' },
      { m: [[1,1],[1,1]], c: '#facc15' },
      { m: [[0,1,0],[1,1,1]], c: '#a855f7' },
      { m: [[1,0,0],[1,1,1]], c: '#3b82f6' },
      { m: [[0,0,1],[1,1,1]], c: '#f97316' },
      { m: [[0,1,1],[1,1,0]], c: '#10b981' },
      { m: [[1,1,0],[0,1,1]], c: '#ef4444' }
    ];

    let board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    let piece = null;
    let score = 0, lines = 0;
    let best = Number(localStorage.getItem('vp_tetris_best') || 0);
    bestEl.textContent = best;
    let state = 'TITLE_MENU';
    let lastTime = 0, dropCounter = 0;

    function newPiece() {
      const t = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      return {
        m: t.m.map(r => [...r]),
        c: t.c,
        x: Math.floor((COLS - t.m[0].length) / 2),
        y: 0
      };
    }

    function collides(p, dx = 0, dy = 0, mat = p.m) {
      for (let r = 0; r < mat.length; r++) {
        for (let c = 0; c < mat[r].length; c++) {
          if (!mat[r][c]) continue;
          const nx = p.x + c + dx;
          const ny = p.y + r + dy;
          if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
          if (ny >= 0 && board[ny][nx]) return true;
        }
      }
      return false;
    }

    function merge() {
      piece.m.forEach((row, r) => {
        row.forEach((v, c) => {
          if (v && piece.y + r >= 0) board[piece.y + r][piece.x + c] = piece.c;
        });
      });
      let cleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r].every(cell => cell !== null)) {
          board.splice(r, 1);
          board.unshift(Array(COLS).fill(null));
          cleared++;
          r++;
        }
      }
      if (cleared > 0) {
        lines += cleared;
        score += [0, 100, 300, 500, 800][cleared];
        scoreEl.textContent = score;
        linesEl.textContent = lines;
        if (score > best) {
          best = score;
          localStorage.setItem('vp_tetris_best', String(best));
          bestEl.textContent = best;
        }
      }
      piece = newPiece();
      if (collides(piece)) {
        state = 'GAME_OVER';
        ovTitle.textContent = 'Stack Full';
        ovDesc.textContent = `Score: ${score} · Lines: ${lines}`;
        startBtn.textContent = 'Play Again';
        overlay.classList.remove('hidden');
      }
    }

    function rotatePiece() {
      const rotated = piece.m[0].map((_, idx) => piece.m.map(row => row[idx]).reverse());
      if (!collides(piece, 0, 0, rotated)) piece.m = rotated;
      else if (!collides(piece, -1, 0, rotated)) { piece.x--; piece.m = rotated; }
      else if (!collides(piece, 1, 0, rotated)) { piece.x++; piece.m = rotated; }
    }

    function drawBlock(x, y, color, alpha = 1) {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.fillRect(x * BLOCK + 1, y * BLOCK + 1, BLOCK - 2, BLOCK - 2);
      ctx.globalAlpha = 1;
    }

    function draw() {
      ctx.fillStyle = '#161d28';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath(); ctx.moveTo(x * BLOCK, 0); ctx.lineTo(x * BLOCK, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath(); ctx.moveTo(0, y * BLOCK); ctx.lineTo(canvas.width, y * BLOCK); ctx.stroke();
      }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c]) drawBlock(c, r, board[r][c]);
        }
      }

      if (piece && state === 'PLAYING') {
        let gy = 0;
        while (!collides(piece, 0, gy + 1)) gy++;
        piece.m.forEach((row, r) => row.forEach((v, c) => {
          if (v) drawBlock(piece.x + c, piece.y + r + gy, piece.c, 0.2);
        }));
        piece.m.forEach((row, r) => row.forEach((v, c) => {
          if (v) drawBlock(piece.x + c, piece.y + r, piece.c, 1);
        }));
      }
    }

    function loop(time = 0) {
      const dt = time - lastTime;
      lastTime = time;
      if (state === 'PLAYING') {
        dropCounter += dt;
        const interval = Math.max(180, 680 - Math.floor(lines / 5) * 55);
        if (dropCounter > interval) {
          if (!collides(piece, 0, 1)) piece.y++;
          else merge();
          dropCounter = 0;
        }
      }
      draw();
      requestAnimationFrame(loop);
    }

    function startGame() {
      board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      score = 0;
      lines = 0;
      scoreEl.textContent = '0';
      linesEl.textContent = '0';
      piece = newPiece();
      dropCounter = 0;
      state = 'PLAYING';
      overlay.classList.add('hidden');
    }

    window.addEventListener('keydown', (e) => {
      if (state !== 'PLAYING' || !piece) return;
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
      if (e.code === 'ArrowLeft' && !collides(piece, -1, 0)) piece.x--;
      else if (e.code === 'ArrowRight' && !collides(piece, 1, 0)) piece.x++;
      else if (e.code === 'ArrowDown') {
        if (!collides(piece, 0, 1)) piece.y++;
        else merge();
        dropCounter = 0;
      } else if (e.code === 'ArrowUp' || e.code === 'KeyW') {
        rotatePiece();
      } else if (e.code === 'Space') {
        while (!collides(piece, 0, 1)) piece.y++;
        merge();
        dropCounter = 0;
      }
    });

    startBtn.addEventListener('click', startGame);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
