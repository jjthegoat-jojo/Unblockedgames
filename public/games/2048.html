<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2048 Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #12171e;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .hud {
      width: min(420px, 92vw);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; color: #f59e0b; }
    .stats { display: flex; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
    .stat-box {
      background: #1e2631;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 6px 12px;
      border-radius: 8px;
      text-align: center;
      min-width: 74px;
    }
    .stat-label { font-size: 0.68rem; color: #94a3b8; display: block; }
    .stat-val { font-size: 1rem; font-weight: 700; color: #f8fafc; }
    .icon-btn {
      background: #1e2631;
      color: #cbd5e1;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .icon-btn:hover { background: #283240; color: #fff; }
    .board-wrap {
      position: relative;
      width: min(420px, 92vw);
      aspect-ratio: 1 / 1;
      background: #1b222c;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      touch-action: none;
    }
    .cell {
      background: #252f3d;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: clamp(1.2rem, 5vw, 1.85rem);
      font-variant-numeric: tabular-nums;
      transition: transform 120ms ease, background-color 120ms ease;
    }
    .cell.pop { transform: scale(1.08); }
    .v-2 { background: #e2e8f0; color: #0f172a; }
    .v-4 { background: #cbd5e1; color: #0f172a; }
    .v-8 { background: #fb923c; color: #fff; }
    .v-16 { background: #f97316; color: #fff; }
    .v-32 { background: #ef4444; color: #fff; }
    .v-64 { background: #dc2626; color: #fff; }
    .v-128 { background: #eab308; color: #0f172a; font-size: 1.5rem; }
    .v-256 { background: #facc15; color: #0f172a; font-size: 1.5rem; }
    .v-512 { background: #f59e0b; color: #0f172a; font-size: 1.5rem; }
    .v-1024 { background: #10b981; color: #fff; font-size: 1.3rem; }
    .v-2048 { background: #059669; color: #fff; font-size: 1.3rem; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 20, 26, 0.9);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 1.75rem; margin-bottom: 8px; color: #f8fafc; }
    .overlay p { font-size: 0.92rem; color: #94a3b8; max-width: 280px; line-height: 1.5; margin-bottom: 20px; }
    .primary-btn {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .primary-btn:hover { background: #fbbf24; }
    .hint { margin-top: 12px; font-size: 0.8rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="title">2048</div>
    <div class="stats">
      <div class="stat-box">
        <span class="stat-label">Score</span>
        <span class="stat-val" id="score">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Best</span>
        <span class="stat-val" id="best">0</span>
      </div>
      <button class="icon-btn" id="resetBtn" type="button">Restart</button>
    </div>
  </div>

  <div class="board-wrap" id="board">
    <div class="overlay" id="menuOverlay">
      <h2 id="overlayTitle">2048 Classic</h2>
      <p id="overlayDesc">Use Arrow keys, WASD, or swipe to slide tiles. Matching numbers merge into one.</p>
      <button class="primary-btn" id="startBtn" type="button">Start Game</button>
    </div>
  </div>
  <div class="hint">Controls: Arrow Keys / WASD / Touch Swipe</div>

  <script>
    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('menuOverlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');

    let grid = Array.from({ length: 4 }, () => Array(4).fill(0));
    let score = 0;
    let best = Number(localStorage.getItem('vp_2048_best') || 0);
    let state = 'TITLE_MENU';
    bestEl.textContent = best;

    const cells = [];
    for (let i = 0; i < 16; i++) {
      const d = document.createElement('div');
      d.className = 'cell';
      boardEl.insertBefore(d, overlay);
      cells.push(d);
    }

    let audioCtx = null;
    function beep(freq, dur = 0.06) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (_) {}
    }

    function spawnTile() {
      const empty = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) empty.push([r, c]);
        }
      }
      if (!empty.length) return;
      const [r, c] = empty[Math.floor(Math.random() * empty.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function render(mergedIndices = new Set()) {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const idx = r * 4 + c;
          const val = grid[r][c];
          const el = cells[idx];
          el.textContent = val ? String(val) : '';
          el.className = 'cell' + (val ? ' v-' + Math.min(val, 2048) : '');
          if (mergedIndices.has(idx)) {
            el.classList.add('pop');
            setTimeout(() => el.classList.remove('pop'), 130);
          }
        }
      }
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem('vp_2048_best', String(best));
        bestEl.textContent = best;
      }
    }

    function startGame() {
      grid = Array.from({ length: 4 }, () => Array(4).fill(0));
      score = 0;
      state = 'PLAYING';
      overlay.classList.add('hidden');
      spawnTile();
      spawnTile();
      render();
      beep(440, 0.08);
    }

    function slideLine(line) {
      const nonZero = line.filter(v => v !== 0);
      const out = [];
      let gained = 0;
      const mergedPos = [];
      for (let i = 0; i < nonZero.length; i++) {
        if (i + 1 < nonZero.length && nonZero[i] === nonZero[i + 1]) {
          const merged = nonZero[i] * 2;
          out.push(merged);
          mergedPos.push(out.length - 1);
          gained += merged;
          i++;
        } else {
          out.push(nonZero[i]);
        }
      }
      while (out.length < 4) out.push(0);
      return { out, gained, mergedPos };
    }

    function canMove() {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) return true;
          if (c < 3 && grid[r][c] === grid[r][c + 1]) return true;
          if (r < 3 && grid[r][c] === grid[r + 1][c]) return true;
        }
      }
      return false;
    }

    function move(dir) {
      if (state !== 'PLAYING') return;
      let moved = false;
      let totalGained = 0;
      const mergedSet = new Set();

      for (let i = 0; i < 4; i++) {
        let line = [];
        for (let j = 0; j < 4; j++) {
          if (dir === 'LEFT') line.push(grid[i][j]);
          if (dir === 'RIGHT') line.push(grid[i][3 - j]);
          if (dir === 'UP') line.push(grid[j][i]);
          if (dir === 'DOWN') line.push(grid[3 - j][i]);
        }
        const { out, gained, mergedPos } = slideLine(line);
        totalGained += gained;
        for (let j = 0; j < 4; j++) {
          let r = i, c = j;
          if (dir === 'RIGHT') { r = i; c = 3 - j; }
          if (dir === 'UP') { r = j; c = i; }
          if (dir === 'DOWN') { r = 3 - j; c = i; }
          if (grid[r][c] !== out[j]) moved = true;
          grid[r][c] = out[j];
          if (mergedPos.includes(j)) mergedSet.add(r * 4 + c);
        }
      }

      if (moved) {
        score += totalGained;
        spawnTile();
        render(mergedSet);
        beep(totalGained > 0 ? 580 : 320, 0.05);
        if (!canMove()) {
          state = 'GAME_OVER';
          overlayTitle.textContent = 'No Moves Left';
          overlayDesc.textContent = `Final Score: ${score} · Best: ${best}`;
          startBtn.textContent = 'Play Again';
          overlay.classList.remove('hidden');
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      const map = {
        ArrowLeft: 'LEFT', KeyA: 'LEFT',
        ArrowRight: 'RIGHT', KeyD: 'RIGHT',
        ArrowUp: 'UP', KeyW: 'UP',
        ArrowDown: 'DOWN', KeyS: 'DOWN'
      };
      if (map[e.code]) {
        e.preventDefault();
        move(map[e.code]);
      }
    });

    let sx = 0, sy = 0;
    boardEl.addEventListener('pointerdown', (e) => { sx = e.clientX; sy = e.clientY; });
    boardEl.addEventListener('pointerup', (e) => {
      const dx = e.clientX - sx;
      const dy = e.clientY - sy;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'RIGHT' : 'LEFT');
      else move(dy > 0 ? 'DOWN' : 'UP');
    });

    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
